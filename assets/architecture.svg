<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330"><rect width="900" height="330" rx="16" fill="#fff" stroke="#e2e8f0"/><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs><text x="24" y="36" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Layered design: user interaction is separate from database code</text><rect x="24" y="74" width="148" height="104" rx="14" fill="#0369a1"/><text x="98" y="108" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">cli.py</text><text x="98" y="132" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fff" fill-opacity=".95">HelpDeskCLI</text><text x="98" y="154" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#fff" fill-opacity=".85">menus, prompts, printing</text><line x1="174" y1="126" x2="190" y2="126" stroke="#94a3b8" stroke-width="3" marker-end="url(#ar)"/><rect x="192" y="74" width="148" height="104" rx="14" fill="#7c3aed"/><text x="266" y="108" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">service.py</text><text x="266" y="132" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fff" fill-opacity=".95">TicketService</text><text x="266" y="154" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#fff" fill-opacity=".85">rules, validation, errors</text><line x1="342" y1="126" x2="358" y2="126" stroke="#94a3b8" stroke-width="3" marker-end="url(#ar)"/><rect x="360" y="74" width="148" height="104" rx="14" fill="#059669"/><text x="434" y="108" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">database.py</text><text x="434" y="132" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fff" fill-opacity=".95">TicketRepository</text><text x="434" y="154" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#fff" fill-opacity=".85">all SQL lives here</text><line x1="510" y1="126" x2="526" y2="126" stroke="#94a3b8" stroke-width="3" marker-end="url(#ar)"/><rect x="528" y="74" width="148" height="104" rx="14" fill="#475569"/><text x="602" y="108" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">helpdesk.db</text><text x="602" y="132" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#fff" fill-opacity=".95">SQLite file</text><text x="602" y="154" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#fff" fill-opacity=".85">tickets table</text><text x="24" y="212" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#64748b">User  to  cli.py  to  service.py  to  database.py  to  SQLite. Each layer only talks to the next one.</text><rect x="24" y="232" width="852" height="74" rx="12" fill="#f1f5f9"/><text x="44" y="258" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#0f172a">Shared helpers (no database, no printing):</text><text x="44" y="282" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#475569">models.py = Ticket, Priority, Status    |    validation.py = input checks    |    reports.py = tables and summary text    |    errors.py = exceptions</text></svg>